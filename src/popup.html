<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arabic RTL for Claude</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <header class="header">
      <img class="logo" src="../icons/icon48.png" alt="">
      <div class="header-text">
        <h1 class="title" data-i18n="title">Arabic RTL for Claude</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </header>

    <section class="controls">
      <div class="row">
        <label class="row-label" for="opt-enabled" data-i18n="enable">تفعيل الإضافة</label>
        <label class="switch">
          <input type="checkbox" id="opt-enabled">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>

      <div class="row">
        <label class="row-label" for="opt-input" data-i18n="enableInput">تفعيل في مربع الكتابة</label>
        <label class="switch">
          <input type="checkbox" id="opt-input">
          <span class="slider" aria-hidden="true"></span>
        </label>
      </div>

      <div class="row">
        <span class="row-label" data-i18n="language">لغة الواجهة</span>
        <div class="radio-group">
          <label class="radio">
            <input type="radio" name="ui-lang" value="ar">
            <span data-i18n="arabic">العربية</span>
          </label>
          <label class="radio">
            <input type="radio" name="ui-lang" value="en">
            <span data-i18n="english">English</span>
          </label>
        </div>
      </div>
    </section>

    <footer class="footer">
      <a class="repo-link" id="repo-link" href="https://github.com/MaherSaleem/claude-rtl"
         target="_blank" rel="noopener noreferrer"
         title="View the source code on GitHub" data-i18n-title="sourceTitle">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        <span data-i18n="openSource">مفتوح المصدر على GitHub</span>
      </a>
      <span class="version" id="version"></span>
    </footer>
  </main>

  <script src="constants.js"></script>
  <script src="popup.js"></script>
</body>
</html>
